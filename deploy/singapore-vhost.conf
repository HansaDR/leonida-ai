# Candidate HTTP include. Test in a standalone nginx config before installing.
# The live stream SNI map would need its own reviewed, exact hostname entry.
map $http_origin $leonida_backend_origin {
    default "";
    "https://gta6.locoai.qzz.io" "http://127.0.0.1:8766";
}

server {
    listen 127.0.0.1:1444 ssl;
    server_name gta6.locoai.qzz.io;
    ssl_certificate /etc/letsencrypt/live/gta6.locoai.qzz.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gta6.locoai.qzz.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($host != "gta6.locoai.qzz.io") { return 421; }

    access_log off;
    client_max_body_size 8k;
    client_body_timeout 10s;
    add_header Strict-Transport-Security "max-age=86400" always;

    location / {
        proxy_pass http://127.0.0.1:18766;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host 127.0.0.1:8766;
        proxy_set_header Origin $leonida_backend_origin;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_redirect off;
    }
}
